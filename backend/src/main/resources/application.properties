spring.application.name=leasing-document-backend

# =========================================================
# DATABASE CONFIGURATION
#
# Environment variables can override these development
# defaults when the application is deployed.
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leasing_document_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8080}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# JWT CONFIGURATION
#
# Development defaults preserve the current working login.
# Production deployment can override these values using
# environment variables.
# =========================================================

app.jwt.secret=${JWT_SECRET:leasing-document-backend-secret-key-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}